<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Holo-Map｜樹莓派地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; color: #e2e8f0; background: #0b1220; }
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; z-index: 2; top: 12px; left: 12px; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 14px; border: 1px solid #334155; border-radius: 12px; background: rgba(15,23,42,.96); box-shadow: 0 8px 28px #0008; }
    h1 { margin: 0; font-size: 19px; }
    .hint, #status { color: #aab8ca; font-size: 13px; line-height: 1.5; }
    #status { margin: 10px 0; padding: 8px; border-radius: 7px; background: #111c31; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    button, input::file-selector-button { min-height: 42px; padding: 8px 12px; border: 1px solid #475569; border-radius: 8px; background: #1e293b; color: #f8fafc; font: inherit; cursor: pointer; }
    button.primary { background: #0369a1; border-color: #0284c7; }
    button:disabled { opacity: .5; cursor: default; }
    #routeFile { width: 100%; min-height: 42px; color: #cbd5e1; }
    #coords { font-variant-numeric: tabular-nums; }
    .maplibregl-ctrl-group button { min-height: 29px; }
    @media (max-width: 600px) {
      .panel { top: 8px; left: 8px; width: min(100% - 16px, 360px); max-height: 48vh; padding: 11px; }
      h1 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="互動地圖"></div>
  <main class="panel">
    <h1>Holo-Map｜樹莓派版</h1>
    <p class="hint"><a href="./bds_map.html" style="color:#7dd3fc">開啟 UART 行程儀表板</a></p>
    <div id="status" role="status" aria-live="polite">地圖載入中…</div>
    <div class="row">
      <button id="serialBtn" class="primary" type="button" disabled>連接 USB GPS</button>
      <button id="geoBtn" type="button" disabled>使用裝置定位</button>
    </div>
    <div id="coords" class="hint">座標：尚未定位</div>
    <hr>
    <label for="routeFile">匯入路徑（GPX／GeoJSON／JSON／KML）</label>
    <input id="routeFile" type="file" disabled accept=".gpx,.geojson,.json,.kml,application/json,application/gpx+xml">
    <p class="hint">在地圖上點選路徑，可查看匯入檔名及路徑名稱。地圖需要網路連線載入底圖。</p>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./nmea.js"></script>
  <script>
  (() => {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const EMPTY = { type: 'FeatureCollection', features: [] };
    const MAX_FILE_BYTES = 10 * 1024 * 1024;
    const MAX_COORDINATES = 100000;
    let map = null;
    let mapReady = false;
    let serialSession = null;
    let geoWatch = null;
    let geoGeneration = 0;
    let track = [];
    let routeFeatures = [];
    let currentFileUrl = '';
    let currentFileName = '';
    let activePopup = null;
    let importGeneration = 0;

    function setStatus(message) { $('status').textContent = message; }
    function validPoint(point) {
      return Array.isArray(point) && point.length >= 2 && Number.isFinite(point[0]) && Number.isFinite(point[1]) && Math.abs(point[0]) <= 180 && Math.abs(point[1]) <= 90;
    }
    function makePoint(lon, lat) {
      if (!mapReady || !validPoint([lon, lat])) return;
      $('coords').textContent = `座標：${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      map.getSource('position').setData({ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [lon, lat] } });
      map.easeTo({ center: [lon, lat], duration: 350 });
      track.push([lon, lat]);
      if (track.length > 3000) track.shift();
      map.getSource('live-track').setData(track.length > 1 ? { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: track } } : EMPTY);
    }
    function hidePosition() {
      if (mapReady) map.getSource('position').setData(EMPTY);
      $('coords').textContent = '座標：尚未定位';
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    }
    function showImportedPopup(event) {
      const feature = event.features && event.features[0];
      if (!feature) return;
      if (activePopup) activePopup.remove();
      const name = feature.properties && (feature.properties.name || feature.properties.title) || '匯入路徑';
      const link = currentFileUrl ? `<br><a href="${escapeHtml(currentFileUrl)}" download="${escapeHtml(currentFileName)}">下載原始檔：${escapeHtml(currentFileName)}</a>` : '';
      activePopup = new maplibregl.Popup({ maxWidth: '280px' }).setLngLat(event.lngLat).setHTML(`<strong>${escapeHtml(name)}</strong><br>${escapeHtml(currentFileName)}${link}`).addTo(map);
    }

    if (window.maplibregl && window.HoloNmea) {
      map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [120.97, 23.9], zoom: 7, attributionControl: true, dragRotate: false, pitchWithRotate: false, touchPitch: false });
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
      map.on('load', () => {
        map.addSource('position', { type: 'geojson', data: EMPTY });
        map.addLayer({ id: 'position-point', type: 'circle', source: 'position', paint: { 'circle-radius': 8, 'circle-color': '#0ea5e9', 'circle-stroke-width': 3, 'circle-stroke-color': '#fff' } });
        map.addSource('live-track', { type: 'geojson', data: EMPTY });
        map.addLayer({ id: 'live-track-line', type: 'line', source: 'live-track', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#f97316', 'line-width': 4 } });
        map.addSource('imported-routes', { type: 'geojson', data: EMPTY });
        map.addLayer({ id: 'imported-routes', type: 'line', source: 'imported-routes', filter: ['==', ['geometry-type'], 'LineString'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#f97316', 'line-width': 6, 'line-opacity': 0.9 } });
        map.addLayer({ id: 'imported-points', type: 'circle', source: 'imported-routes', filter: ['==', ['geometry-type'], 'Point'], paint: { 'circle-radius': 7, 'circle-color': '#f97316', 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });
        mapReady = true;
        ['serialBtn', 'geoBtn', 'routeFile'].forEach((id) => { $(id).disabled = false; });
        setStatus('地圖就緒。可連接 USB GPS、使用瀏覽器定位或匯入路徑檔。');
      });
      map.on('error', () => setStatus('地圖載入遇到問題，請確認網路連線。'));
      for (const layer of ['imported-routes', 'imported-points']) {
        map.on('click', layer, showImportedPopup);
        map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
      }
    } else {
      setStatus('無法載入地圖或 NMEA 程式，請確認網路連線後重新整理。');
    }

    async function cancelSerialReader(session) {
      if (!session.reader) return;
      if (!session.cancelPromise) session.cancelPromise = (async () => { try { await session.reader.cancel(); } catch (_) {} })();
      await session.cancelPromise;
    }
    async function stopSerial() {
      const session = serialSession;
      if (!session || session.stopping) return;
      session.stopping = true;
      $('serialBtn').disabled = true;
      await cancelSerialReader(session);
      await session.finished;
    }
    async function startSerial() {
      if (!mapReady || serialSession) return;
      if (!('serial' in navigator)) { setStatus('此瀏覽器未提供 USB 序列埠功能。請使用 Chromium，或改按「使用裝置定位」。'); return; }
      let finish;
      const session = { port: null, reader: null, opened: false, stopping: false, finished: new Promise((resolve) => { finish = resolve; }) };
      serialSession = session;
      $('serialBtn').disabled = true;
      let failure = null;
      try {
        session.port = await navigator.serial.requestPort();
        if (session.stopping) return;
        await session.port.open({ baudRate: 115200 });
        session.opened = true;
        if (session.stopping) return;
        session.reader = session.port.readable.getReader();
        $('serialBtn').textContent = '中斷 USB GPS';
        $('serialBtn').disabled = false;
        const decoder = new TextDecoder();
        let buffer = '';
        let dropping = false;
        setStatus('USB GPS 已連線，等待有效 NMEA 定位資料…');
        while (!session.stopping) {
          const { value, done } = await session.reader.read();
          if (done || session.stopping) break;
          const text = decoder.decode(value, { stream: true });
          for (const character of text) {
            if (character === '\n') {
              if (!dropping) {
                const sentence = HoloNmea.parseSentence(buffer.replace(/\r$/, ''));
                if (sentence && sentence.hasFix) makePoint(sentence.lon, sentence.lat);
                else if (sentence) { hidePosition(); setStatus('USB GPS 已連線，等待有效定位…'); }
              }
              buffer = '';
              dropping = false;
            } else if (!dropping) {
              buffer += character;
              if (buffer.length > 1024) { buffer = ''; dropping = true; }
            }
          }
        }
      } catch (error) {
        if (!session.stopping && error.name !== 'NotFoundError') failure = error;
      } finally {
        $('serialBtn').disabled = true;
        await cancelSerialReader(session);
        if (session.reader) { try { session.reader.releaseLock(); } catch (_) {} }
        if (session.opened) { try { await session.port.close(); } catch (_) {} }
        if (serialSession === session) {
          serialSession = null;
          $('serialBtn').textContent = '連接 USB GPS';
          $('serialBtn').disabled = !mapReady;
          hidePosition();
          setStatus(failure ? `USB GPS 連線中斷：${failure.message || failure}` : 'USB GPS 已中斷。');
        }
        finish();
      }
    }
    $('serialBtn').addEventListener('click', () => serialSession ? stopSerial() : startSerial());
    if ('serial' in navigator) navigator.serial.addEventListener('disconnect', (event) => {
      if (serialSession && (event.target === serialSession.port || event.port === serialSession.port)) stopSerial();
    });

    function stopGeolocation() {
      geoGeneration++;
      if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch);
      geoWatch = null;
      $('geoBtn').textContent = '使用裝置定位';
    }
    $('geoBtn').addEventListener('click', () => {
      if (!mapReady) return;
      if (geoWatch != null) { stopGeolocation(); hidePosition(); setStatus('裝置定位已停止。'); return; }
      if (!navigator.geolocation) { setStatus('此瀏覽器不支援裝置定位。'); return; }
      const generation = ++geoGeneration;
      setStatus('正在等待定位…請允許瀏覽器使用位置。');
      $('geoBtn').textContent = '停止裝置定位';
      try {
        geoWatch = navigator.geolocation.watchPosition((position) => {
          if (generation !== geoGeneration) return;
          makePoint(position.coords.longitude, position.coords.latitude);
          setStatus('裝置定位已啟用。');
        }, (error) => {
          if (generation !== geoGeneration) return;
          stopGeolocation();
          setStatus(`無法取得裝置位置：${error.message}`);
        }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
      } catch (error) { stopGeolocation(); setStatus(`無法取得裝置位置：${error.message}`); }
    });

    function numericText(value) {
      if (typeof value !== 'string' || !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(value.trim())) throw new Error('路徑含有無效座標');
      const number = Number(value);
      if (!Number.isFinite(number)) throw new Error('路徑含有無效座標');
      return number;
    }
    function xmlPoint(element) {
      const point = [numericText(element.getAttribute('lon')), numericText(element.getAttribute('lat'))];
      if (!validPoint(point)) throw new Error('路徑座標超出經緯度範圍');
      return point;
    }
    function descendants(element, name) { return [...element.getElementsByTagName('*')].filter((child) => child.localName === name); }
    function children(element, name) { return [...element.children].filter((child) => child.localName === name); }
    function nodeName(element, fallback) { return children(element, 'name')[0]?.textContent || fallback; }
    function feature(geometry, name) { return { type: 'Feature', properties: { name }, geometry }; }
    function parseRouteFile(text, extension) {
      if (extension !== 'gpx' && extension !== 'kml') {
        let data = JSON.parse(text);
        if (data && data.type === 'Feature') data = { type: 'FeatureCollection', features: [data] };
        if (!data || data.type !== 'FeatureCollection' || !Array.isArray(data.features)) throw new Error('GeoJSON 必須是 Feature 或 FeatureCollection');
        return data;
      }
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      if (descendants(xml, 'parsererror').length) throw new Error('XML 檔案格式錯誤');
      const features = [];
      if (extension === 'gpx') {
        for (const track of descendants(xml, 'trk')) {
          for (const segment of children(track, 'trkseg')) {
            const points = children(segment, 'trkpt').map(xmlPoint);
            if (points.length > 1) features.push(feature({ type: 'LineString', coordinates: points }, nodeName(track, 'GPX 軌跡')));
          }
        }
        for (const route of descendants(xml, 'rte')) {
          const points = children(route, 'rtept').map(xmlPoint);
          if (points.length > 1) features.push(feature({ type: 'LineString', coordinates: points }, nodeName(route, 'GPX 路徑')));
        }
        for (const waypoint of descendants(xml, 'wpt')) features.push(feature({ type: 'Point', coordinates: xmlPoint(waypoint) }, nodeName(waypoint, 'Waypoint')));
      } else {
        for (const place of descendants(xml, 'Placemark')) {
          for (const geometry of [...descendants(place, 'LineString'), ...descendants(place, 'Point')]) {
            const node = descendants(geometry, 'coordinates')[0];
            if (!node) throw new Error('KML 缺少座標');
            const points = node.textContent.trim().split(/\s+/).map((tuple) => {
              const values = tuple.split(',');
              if (values.length < 2 || values.length > 3) throw new Error('KML 座標格式錯誤');
              return values.slice(0, 2).map(numericText);
            });
            const point = geometry.localName === 'Point';
            if ((point && points.length !== 1) || (!point && points.length < 2)) throw new Error('KML 座標數量不足');
            features.push(feature({ type: point ? 'Point' : 'LineString', coordinates: point ? points[0] : points }, nodeName(place, 'KML 路徑')));
          }
        }
      }
      return { type: 'FeatureCollection', features };
    }
    function validateRoutes(data, fileName) {
      const coordinates = [];
      function point(value) {
        if (!validPoint(value)) throw new Error('路徑含有無效或超出範圍的座標');
        if (coordinates.length >= MAX_COORDINATES) throw new Error('路徑過大，最多支援 100000 個座標');
        const result = value.slice(0, 2);
        coordinates.push(result);
        return result;
      }
      function line(value) {
        if (!Array.isArray(value) || value.length < 2) throw new Error('路徑至少需要兩個座標');
        return value.map(point);
      }
      const features = [];
      for (const item of data.features) {
        if (!item || item.type !== 'Feature' || !item.geometry) continue;
        const geometry = item.geometry;
        let normalized;
        if (geometry.type === 'Point') normalized = point(geometry.coordinates);
        else if (geometry.type === 'MultiPoint') {
          if (!Array.isArray(geometry.coordinates) || !geometry.coordinates.length) throw new Error('空白 MultiPoint');
          normalized = geometry.coordinates.map(point);
        } else if (geometry.type === 'LineString') normalized = line(geometry.coordinates);
        else if (geometry.type === 'MultiLineString') {
          if (!Array.isArray(geometry.coordinates) || !geometry.coordinates.length) throw new Error('空白 MultiLineString');
          normalized = geometry.coordinates.map(line);
        } else continue;
        const properties = item.properties && typeof item.properties === 'object' && !Array.isArray(item.properties) ? item.properties : {};
        features.push({ type: 'Feature', properties: { name: String(properties.name || properties.title || '匯入路徑'), sourceFile: fileName }, geometry: { type: geometry.type, coordinates: normalized } });
      }
      if (!features.length) throw new Error('檔案中找不到可顯示的路徑或標記');
      return { features, coordinates };
    }
    $('routeFile').addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file || !mapReady) return;
      const generation = ++importGeneration;
      let candidateUrl = '';
      let applied = false;
      try {
        if (file.size > MAX_FILE_BYTES) throw new Error('檔案過大，最多支援 10 MB');
        const text = await file.text();
        if (generation !== importGeneration) return;
        const data = parseRouteFile(text, file.name.split('.').pop().toLowerCase());
        const candidate = validateRoutes(data, file.name);
        const bounds = candidate.coordinates.reduce((result, coordinate) => result.extend(coordinate), new maplibregl.LngLatBounds(candidate.coordinates[0], candidate.coordinates[0]));
        candidateUrl = URL.createObjectURL(file);
        map.getSource('imported-routes').setData({ type: 'FeatureCollection', features: candidate.features });
        applied = true;
        map.fitBounds(bounds, { padding: 50, maxZoom: 15, duration: 400 });
        routeFeatures = candidate.features;
        applied = false;
        if (activePopup) { activePopup.remove(); activePopup = null; }
        if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
        currentFileUrl = candidateUrl;
        candidateUrl = '';
        currentFileName = file.name;
        setStatus(`已載入 ${file.name}（${routeFeatures.length} 條路徑／要素）。點選橘色路徑或標記可查看檔案資訊。`);
      } catch (error) {
        if (applied) map.getSource('imported-routes').setData({ type: 'FeatureCollection', features: routeFeatures });
        setStatus(`匯入失敗：${error.message || error}；保留原先路徑。`);
      }
      finally { if (candidateUrl) URL.revokeObjectURL(candidateUrl); event.target.value = ''; }
    });
    window.addEventListener('pagehide', () => {
      stopGeolocation();
      stopSerial();
      if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
    });
  })();

  </script>
</body>
</html>
